plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hudfree'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.hudfree'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
